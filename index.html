    <style>
:root {
  color-scheme: light;
  --bg: #f6f1e7;
  --surface: #fffdf8;
  --surface-strong: #ffffff;
  --surface-soft: #eef4ea;
  --ink: #18342a;
  --ink-soft: #5d6e64;
  --ink-faint: #849087;
  --green: #1f6f50;
  --green-dark: #14523b;
  --green-pale: #dcebdc;
  --gold: #e7a84b;
  --gold-pale: #f8ead1;
  --coral: #c7604c;
  --coral-pale: #f8e4df;
  --line: #e5e4da;
  --shadow: 0 18px 50px rgba(39, 72, 56, 0.09);
  --shadow-small: 0 8px 24px rgba(39, 72, 56, 0.08);
  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family:
    "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui,
    sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
  scroll-behavior: smooth;
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 8% 2%, rgba(231, 168, 75, 0.16), transparent 25rem),
    radial-gradient(circle at 96% 22%, rgba(31, 111, 80, 0.1), transparent 28rem),
    var(--bg);
}

body.modal-open {
  overflow: hidden;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  color: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid rgba(231, 168, 75, 0.72);
  outline-offset: 2px;
}

svg {
  display: block;
}

.app-shell {
  width: min(100%, 820px);
  min-height: 100vh;
  margin: 0 auto;
  padding: 0 18px calc(104px + var(--safe-bottom));
}

.topbar {
  position: sticky;
  z-index: 30;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 78px;
  padding: 12px 0 10px;
  background: linear-gradient(to bottom, rgba(246, 241, 231, 0.98) 72%, rgba(246, 241, 231, 0));
  backdrop-filter: blur(12px);
}

.brand {
  display: inline-flex;
  gap: 10px;
  align-items: center;
  color: var(--ink);
  text-decoration: none;
}

.brand-mark {
  display: grid;
  width: 44px;
  height: 44px;
  color: var(--green);
  background: var(--surface);
  border: 1px solid rgba(31, 111, 80, 0.09);
  border-radius: 15px;
  box-shadow: var(--shadow-small);
  place-items: center;
}

.brand-mark svg {
  width: 33px;
  height: 33px;
}

.brand span:last-child {
  display: grid;
  gap: 1px;
}

.brand strong {
  font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.brand small {
  color: var(--ink-faint);
  font-size: 10px;
  letter-spacing: 0.12em;
}

.topbar-actions,
.inline-actions {
  display: flex;
  gap: 9px;
  align-items: center;
}

.icon-button {
  display: grid;
  width: 42px;
  height: 42px;
  padding: 0;
  background: rgba(255, 253, 248, 0.78);
  border: 1px solid rgba(31, 111, 80, 0.1);
  border-radius: 14px;
  cursor: pointer;
  place-items: center;
}

.icon-button svg {
  width: 21px;
  height: 21px;
}

.connection-badge {
  padding: 5px 9px;
  color: #8c5126;
  font-size: 11px;
  font-weight: 700;
  background: var(--gold-pale);
  border-radius: 999px;
}

.main-content {
  min-height: 65vh;
  animation: view-in 260ms ease both;
}

@keyframes view-in {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
}

.screen-head {
  display: flex;
  gap: 16px;
  align-items: flex-end;
  justify-content: space-between;
  margin: 10px 2px 18px;
}

.screen-head h1,
.section-title,
.modal-title,
.hero-number,
.empty-state h2 {
  font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
}

.screen-head h1 {
  margin: 0;
  font-size: clamp(27px, 7vw, 38px);
  line-height: 1.14;
  letter-spacing: -0.02em;
}

.screen-head p {
  margin: 7px 0 0;
  color: var(--ink-soft);
  font-size: 13px;
  line-height: 1.6;
}

.eyebrow {
  margin: 0 0 5px;
  color: var(--green);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.date-control {
  display: flex;
  gap: 5px;
  align-items: center;
  padding: 5px;
  background: rgba(255, 253, 248, 0.76);
  border: 1px solid var(--line);
  border-radius: 999px;
}

.date-control button {
  display: grid;
  width: 31px;
  height: 31px;
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  place-items: center;
}

.date-control button:hover {
  background: var(--green-pale);
}

.date-control input {
  width: 116px;
  padding: 0;
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
  text-align: center;
  background: transparent;
  border: 0;
}

.summary-card {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(128px, 0.82fr) 1.18fr;
  gap: 18px;
  padding: 25px 22px;
  background:
    radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.1), transparent 11rem),
    linear-gradient(145deg, #1d6b4c, #144d38);
  border-radius: var(--radius-xl);
  box-shadow: 0 22px 55px rgba(22, 81, 58, 0.2);
}

.summary-card::after {
  position: absolute;
  right: -40px;
  bottom: -55px;
  width: 180px;
  height: 180px;
  background: rgba(231, 168, 75, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 50%;
  content: "";
}

.calorie-ring {
  --progress: 0deg;
  position: relative;
  display: grid;
  width: min(100%, 154px);
  aspect-ratio: 1;
  margin: auto;
  background:
    radial-gradient(circle, #1a6046 56%, transparent 57%),
    conic-gradient(var(--gold) var(--progress), rgba(255, 255, 255, 0.14) 0);
  border-radius: 50%;
  place-items: center;
}

.calorie-ring::after {
  position: absolute;
  width: 126px;
  aspect-ratio: 1;
  border: 1px solid rgba(255, 255, 255, 0.13);
  border-radius: 50%;
  content: "";
}

.ring-content {
  position: relative;
  z-index: 1;
  display: grid;
  text-align: center;
}

.hero-number {
  color: #fffdf8;
  font-size: 35px;
  font-weight: 800;
  line-height: 1;
}

.ring-content small {
  margin-top: 5px;
  color: rgba(255, 255, 255, 0.7);
  font-size: 11px;
}

.summary-details {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.summary-kicker {
  margin: 0;
  color: rgba(255, 255, 255, 0.68);
  font-size: 12px;
}

.summary-value {
  margin: 4px 0 1px;
  color: #fffdf8;
  font-size: clamp(23px, 6vw, 31px);
  font-weight: 800;
  line-height: 1.1;
}

.summary-value span {
  margin-left: 3px;
  color: rgba(255, 255, 255, 0.62);
  font-size: 12px;
  font-weight: 500;
}

.summary-message {
  margin: 10px 0 15px;
  color: rgba(255, 255, 255, 0.74);
  font-size: 12px;
  line-height: 1.55;
}

.summary-split {
  display: flex;
  gap: 18px;
  padding-top: 13px;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
}

.summary-split div {
  display: grid;
  gap: 2px;
}

.summary-split strong {
  color: #fff;
  font-size: 13px;
}

.summary-split span {
  color: rgba(255, 255, 255, 0.57);
  font-size: 10px;
}

.macro-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 15px 0 25px;
}

.macro-card {
  min-width: 0;
  padding: 15px 14px 13px;
  background: rgba(255, 253, 248, 0.78);
  border: 1px solid rgba(31, 111, 80, 0.08);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-small);
}

.macro-card-head {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
}

.macro-card-head span {
  color: var(--ink-soft);
  font-size: 11px;
  font-weight: 700;
}

.macro-card-head strong {
  font-size: 12px;
}

.progress-track {
  overflow: hidden;
  height: 5px;
  margin-top: 11px;
  background: #eceee6;
  border-radius: 999px;
}

.progress-fill {
  height: 100%;
  background: var(--green);
  border-radius: inherit;
  transition: width 350ms ease;
}

.macro-card:nth-child(2) .progress-fill {
  background: var(--gold);
}

.macro-card:nth-child(3) .progress-fill {
  background: var(--coral);
}

.macro-value {
  margin-top: 8px;
  color: var(--ink-soft);
  font-size: 10px;
}

.section-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 21px 2px 11px;
}

.section-title-row h2 {
  margin: 0;
  font-size: 20px;
}

.section-title-row p {
  margin: 3px 0 0;
  color: var(--ink-faint);
  font-size: 11px;
}

.meal-card,
.panel-card,
.empty-state,
.day-card {
  background: rgba(255, 253, 248, 0.84);
  border: 1px solid rgba(31, 111, 80, 0.08);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-small);
}

.meal-card {
  overflow: hidden;
  margin-bottom: 11px;
}

.meal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 16px;
  background: linear-gradient(to right, rgba(220, 235, 220, 0.55), transparent);
  border-bottom: 1px solid rgba(31, 111, 80, 0.07);
}

.meal-name {
  display: flex;
  gap: 9px;
  align-items: center;
}

.meal-icon {
  display: grid;
  width: 28px;
  height: 28px;
  color: var(--green);
  background: var(--green-pale);
  border-radius: 9px;
  place-items: center;
}

.meal-icon svg {
  width: 16px;
  height: 16px;
}

.meal-name strong {
  font-size: 13px;
}

.meal-total {
  color: var(--ink-soft);
  font-size: 11px;
  font-weight: 700;
}

.meal-add {
  display: inline-flex;
  gap: 4px;
  align-items: center;
  padding: 6px 9px;
  color: var(--green);
  font-size: 11px;
  font-weight: 700;
  background: transparent;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}

.meal-add:hover {

"use strict";
// ---- nutrition.js ----
const ACTIVITY_LEVELS = {
  sedentary: { label: "久坐为主", factor: 1.2 },
  light: { label: "轻度活动", factor: 1.375 },
  moderate: { label: "中度活动", factor: 1.55 },
  active: { label: "高度活动", factor: 1.725 }
};

const MEALS = {
  breakfast: "早餐",
  lunch: "午餐",
  dinner: "晚餐",
  snack: "加餐"
};

const DEFAULT_PROFILE = {
  id: "default",
  sex: "male",
  age: 25,
  height: 170,
  currentWeight: 70,
  targetWeight: 65,
  activity: "sedentary",
  weeklyLoss: 0.5,
  goalOverride: null
};

function clampNumber(value, min, max, fallback = min) {
  const number = Number(value);
  if (!Number.isFinite(number)) return fallback;
  return Math.min(max, Math.max(min, number));
}

function round1(value) {
  return Math.round((Number(value) + Number.EPSILON) * 10) / 10;
}

function roundWhole(value) {
  return Math.round(Number(value) + Number.EPSILON);
}

function toDateKey(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function parseDateKey(dateKey) {
  const [year, month, day] = dateKey.split("-").map(Number);
  return new Date(year, month - 1, day, 12, 0, 0, 0);
}

function shiftDateKey(dateKey, days) {
  const date = parseDateKey(dateKey);
  date.setDate(date.getDate() + days);
  return toDateKey(date);
}

function getRecentDateKeys(count, endDate = toDateKey()) {
  return Array.from({ length: count }, (_, index) => shiftDateKey(endDate, index - count + 1));
}

function formatDateShort(dateKey) {
  const date = parseDateKey(dateKey);
  return `${date.getMonth() + 1} 月 ${date.getDate()} 日`;
}

function formatDateFull(dateKey) {
  const date = parseDateKey(dateKey);
  const weekdays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  return `${date.getFullYear()} 年 ${date.getMonth() + 1} 月 ${date.getDate()} 日 · ${weekdays[date.getDay()]}`;
}

function formatDateRelative(dateKey) {
  const today = toDateKey();
  if (dateKey === today) return `今天 · ${formatDateShort(dateKey)}`;
  if (dateKey === shiftDateKey(today, -1)) return `昨天 · ${formatDateShort(dateKey)}`;
  return formatDateShort(dateKey);
}

function calculateGoal(profile = DEFAULT_PROFILE) {
  const sex = profile.sex === "female" ? "female" : "male";
  const age = clampNumber(profile.age, 18, 100, 25);
  const height = clampNumber(profile.height, 120, 230, 170);
  const weight = clampNumber(profile.currentWeight, 30, 300, 70);
  const targetWeight = clampNumber(profile.targetWeight, 30, 300, weight);
  const activity = ACTIVITY_LEVELS[profile.activity] ? profile.activity : "sedentary";
  const factor = ACTIVITY_LEVELS[activity].factor;
  const sexConstant = sex === "male" ? 5 : -161;

  const bmr = 10 * weight + 6.25 * height - 5 * age + sexConstant;
  const maintenance = bmr * factor;
  const rate = clampNumber(profile.weeklyLoss, 0, 1, 0.5);
  const deficit = (rate * 7700) / 7;
  const safetyFloor = sex === "male" ? 1500 : 1200;
  const calculatedGoal = Math.round((maintenance - deficit) / 10) * 10;
  const adjustedGoal = Math.max(safetyFloor, calculatedGoal);
  const override = Number(profile.goalOverride);
  const hasOverride = Number.isFinite(override) && override > 0;
  const dailyGoal = hasOverride ? Math.round(override) : adjustedGoal;
  const protein = weight * 1.6;
  const fat = Math.max(30, (dailyGoal * 0.25) / 9);
  const carbs = Math.max(0, (dailyGoal - protein * 4 - fat * 9) / 4);

  return {
    bmr: roundWhole(bmr),
    maintenance: roundWhole(maintenance),
    calculatedGoal,
    adjustedGoal,
    safetyFloor,
    safetyAdjusted: !hasOverride && calculatedGoal < safetyFloor,
    dailyGoal: roundWhole(dailyGoal),
    proteinGoal: roundWhole(protein),
    fatGoal: roundWhole(fat),
    carbsGoal: roundWhole(carbs),
    targetWeight: round1(targetWeight),
    weeksToGoal:
      rate > 0 ? Math.max(0, Math.ceil(Math.max(0, weight - targetWeight) / rate)) : null
  };
}

function nutrientsForAmount(food, amountInBase) {
  const amount = Math.max(0, Number(amountInBase) || 0);
  const multiplier = amount / 100;
  return {
    kcal: food.kcal * multiplier,
    protein: food.protein * multiplier,
    fat: food.fat * multiplier,
    carbs: food.carbs * multiplier
  };
}

function amountForServing(food, unitId, quantity) {
  const qty = Math.max(0, Number(quantity) || 0);
  if (!unitId || unitId === "base") return qty;

  const serving = (food.servings || []).find((item) => item.id === unitId);
  if (!serving) return qty;
  return qty * serving.amount;
}

function sumNutrients(items) {
  return items.reduce(
    (total, item) => ({
      kcal: total.kcal + (Number(item.kcal) || 0),
      protein: total.protein + (Number(item.protein) || 0),
      fat: total.fat + (Number(item.fat) || 0),
      carbs: total.carbs + (Number(item.carbs) || 0)
    }),
    { kcal: 0, protein: 0, fat: 0, carbs: 0 }
  );
}

function formatAmount(entry) {
  if (!entry) return "";
  if (entry.unitId === "base") {
    return `${round1(entry.amount)} ${entry.food.basis === "ml" ? "ml" : "g"}`;
  }
  const servingLabel =
    entry.unitLabel ||
    (entry.food.servings || []).find((serving) => serving.id === entry.unitId)?.label ||
    "";
  const labelWithoutAmount = servingLabel.replace(/^1\s*/, "");
  return `${round1(entry.amount)} ${labelWithoutAmount} · ${round1(entry.amountInBase)}${
    entry.food.basis === "ml" ? " ml" : " g"
  }`;
}

const CHINESE_DIGITS = {
  零: 0,
  一: 1,
  二: 2,
  两: 2,
  三: 3,
  四: 4,
  五: 5,
  六: 6,
  七: 7,
  八: 8,
  九: 9
};

function parseChineseNumber(text) {
  if (!text) return Number.NaN;
  if (/^\d+(?:\.\d+)?$/.test(text)) return Number(text);
  if (text === "十") return 10;

  const tenIndex = text.indexOf("十");
  if (tenIndex >= 0) {
    const left = tenIndex === 0 ? 1 : CHINESE_DIGITS[text.slice(0, tenIndex)];
    const right =
      tenIndex === text.length - 1 ? 0 : CHINESE_DIGITS[text.slice(tenIndex + 1)];
    if (Number.isFinite(left) && Number.isFinite(right)) return left * 10 + right;
    return Number.NaN;
  }

  if (text.length === 1) return CHINESE_DIGITS[text] ?? Number.NaN;
  return Number.NaN;
}

function parseFoodQuery(rawQuery) {
  const query = String(rawQuery || "").trim();
  if (!query) return { query, quantity: null, unit: null, parsed: false };

  const numberPattern = "\\d+(?:\\.\\d+)?|[零一二两三四五六七八九十]+";
  const unitPattern = "克|g|毫升|ml|个|只|杯|碗|片|份|根|盒|瓶";
  const prefix = new RegExp(`^(${numberPattern})\\s*(${unitPattern})\\s*(.+)$`, "i");
  const suffix = new RegExp(`^(.+?)\\s*(${numberPattern})\\s*(${unitPattern})`, "i");

  let match = query.match(prefix);
  if (match) {
    return {
      query: match[3].trim(),
      quantity: parseChineseNumber(match[1].toLowerCase()),
      unit: match[2].toLowerCase(),
      parsed: true
    };
  }

  match = query.match(suffix);
  if (match) {
    return {
      query: match[1].trim(),
      quantity: parseChineseNumber(match[2].toLowerCase()),
      unit: match[3].toLowerCase(),
      parsed: true
    };
  }

  return { query, quantity: null, unit: null, parsed: false };
}

function unitToBaseIntent(unit, basis) {
  if (!unit) return null;
  if (unit === "g" || unit === "克") return basis === "g" ? "base" : null;
  if (unit === "ml" || unit === "毫升") return basis === "ml" ? "base" : null;
  return null;
}

function summarizeDay(entries) {
  return sumNutrients(entries);

function groupEntriesByMeal(entries) {
  return Object.keys(MEALS).reduce((groups, meal) => {
    groups[meal] = entries.filter((entry) => entry.meal === meal);
    return groups;
  }, {});
}

function getGoalMessage(total, goal) {
  const remaining = goal - total;
  if (total === 0) return "从第一餐开始记录，今天会更清楚。";
  if (remaining > goal * 0.35) return `还可以摄入约 ${roundWhole(remaining)} kcal。`;

  if (remaining > -150) return `已接近目标，超出 ${Math.abs(roundWhole(remaining))} kcal。`;
  return `今天超出目标 ${Math.abs(roundWhole(remaining))} kcal，明天继续即可。`;
}

function safePercent(value, goal) {
  if (!goal || goal <= 0) return 0;
  return Math.min(100, Math.max(0, (value / goal) * 100));
}

const DB_NAME = "shike-calorie";
const DB_VERSION = 1;

let databasePromise;

function requestAsPromise(request) {
  return new Promise((resolve, reject) => {
    request.addEventListener("success", () => resolve(request.result), { once: true });
    request.addEventListener("error", () => reject(request.error), { once: true });
  });
}

function transactionDone(transaction) {
  return new Promise((resolve, reject) => {
    transaction.addEventListener("complete", resolve, { once: true });
    transaction.addEventListener("abort", () => reject(transaction.error), { once: true });
    transaction.addEventListener("error", () => reject(transaction.error), { once: true });
  });
}

function openDatabase() {
  if (databasePromise) return databasePromise;

  databasePromise = new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.addEventListener("upgradeneeded", () => {
      const db = request.result;

      if (!db.objectStoreNames.contains("profile")) {
        db.createObjectStore("profile", { keyPath: "id" });
      }

      if (!db.objectStoreNames.contains("entries")) {
        const entries = db.createObjectStore("entries", { keyPath: "id" });
        entries.createIndex("date", "date", { unique: false });
        entries.createIndex("createdAt", "createdAt", { unique: false });
      }

      if (!db.objectStoreNames.contains("weights")) {
        db.createObjectStore("weights", { keyPath: "date" });
      }

      if (!db.objectStoreNames.contains("foods")) {
        const foods = db.createObjectStore("foods", { keyPath: "id" });
        foods.createIndex("name", "name", { unique: false });
        foods.createIndex("category", "category", { unique: false });
        foods.createIndex("sourceKey", "sourceKey", { unique: false });
      }

      if (!db.objectStoreNames.contains("meta")) {
        db.createObjectStore("meta", { keyPath: "key" });
      }
    });

    request.addEventListener("success", () => {
      const db = request.result;
      db.addEventListener("versionchange", () => db.close());
      resolve(db);
    });
    request.addEventListener("error", () => reject(request.error), { once: true });
    request.addEventListener("blocked", () => {
      reject(new Error("数据库升级被另一个页面占用，请关闭其他食刻页面后重试。"));
    }, { once: true });
  });

  return databasePromise;
}

async function getAllFromStore(storeName) {
  const db = await openDatabase();
  const transaction = db.transaction(storeName, "readonly");
  return requestAsPromise(transaction.objectStore(storeName).getAll());
}

async function initDatabase() {
  const db = await openDatabase();
  const existingFoods = await getAllFromStore("foods");
  const existingById = new Map(existingFoods.map((food) => [food.id, food]));
  const foodsToWrite = builtInFoods.filter((food) => {
    const current = existingById.get(food.id);
    return !current || (current.builtinVersion || 0) < BUILTIN_VERSION;
  });

  if (foodsToWrite.length) {
    const transaction = db.transaction("foods", "readwrite");
    const store = transaction.objectStore("foods");
    foodsToWrite.forEach((food) => store.put({ ...food, updatedAt: new Date().toISOString() }));
    await transactionDone(transaction);
  }

  return db;
}

  const db = await openDatabase();
  const transaction = db.transaction("profile", "readonly");
  const profile = await requestAsPromise(transaction.objectStore("profile").get("default"));

  await transactionDone(transaction);
  return record;
}

async function replaceUserData({ profile, entries, weights, foods }) {
  const db = await openDatabase();
  const transaction = db.transaction(
    ["profile", "entries", "weights", "foods"],
    "readwrite"
  );
  const profileStore = transaction.objectStore("profile");
  const entryStore = transaction.objectStore("entries");
  const weightStore = transaction.objectStore("weights");
  const foodStore = transaction.objectStore("foods");

  profileStore.clear();
  entryStore.clear();
  weightStore.clear();
  foodStore.clear();

  builtInFoods.forEach((food) => foodStore.put({ ...food }));
  foods
    .filter((food) => food.sourceKey !== "builtin")
    .forEach((food) => foodStore.put({ ...food, updatedAt: new Date().toISOString() }));
  if (profile) profileStore.put({ ...profile, id: "default" });
  entries.forEach((entry) => entryStore.put(entry));
  weights.forEach((record) => weightStore.put(record));

  await transactionDone(transaction);
}

async function clearAllUserData() {
  const db = await openDatabase();
  const transaction = db.transaction(
    ["profile", "entries", "weights", "foods", "meta"],
    "readwrite"
  );
  transaction.objectStore("profile").clear();
  transaction.objectStore("entries").clear();
  transaction.objectStore("weights").clear();
  transaction.objectStore("foods").clear();
  transaction.objectStore("meta").clear();
  await transactionDone(transaction);
  await initDatabase();
}

const OPEN_FOOD_FACTS_SEARCH = "https://world.openfoodfacts.org/api/v2/search";

function numeric(value) {
  if (value == null || String(value).trim() === "") return null;
  const number = Number(String(value).replace(",", "."));
  return Number.isFinite(number) ? number : null;
}

function parseServing(product) {
  const size = String(product.serving_size || "");
  const match = size.match(/(\d+(?:[.,]\d+)?)\s*(g|克|ml|毫升)/i);
  if (!match) return [];
  const amount = numeric(match[1]);
  if (!amount) return [];
  const isMilliliter = /ml|毫升/i.test(match[2]);
  return [
    {
      id: "off-serving",
      label: `1 份（${size}）`,
      amount
    },
    {
      id: "off-serving-original",
      label: `1 份（${amount}${isMilliliter ? " ml" : " g"}）`,
      amount
    }
  ];
}

function hashText(text) {
  let hash = 0;
  for (let index = 0; index < text.length; index += 1) {
    hash = (hash * 31 + text.charCodeAt(index)) >>> 0;
  }
  return hash.toString(36);
}

function mapOpenFoodFactsProduct(product) {
  if (!product || typeof product !== "object") return null;

  const name = String(
    product.product_name_zh ||
      product.product_name ||
      product.product_name_en ||
      product.generic_name ||
      ""
  ).trim();
  if (!name) return null;

  const brand = String(product.brands || "").split(",")[0].trim();
  const kcal =
    numeric(product.nutriments?.["energy-kcal_100g"]) ??
    (numeric(product.nutriments?.["energy-kj_100g"]) != null
      ? numeric(product.nutriments["energy-kj_100g"]) / 4.184
      : null) ??
    (numeric(product.nutriments?.energy_100g) != null
      ? numeric(product.nutriments.energy_100g) / 4.184
      : null);
  const protein = numeric(product.nutriments?.proteins_100g) ?? 0;
  const fat = numeric(product.nutriments?.fat_100g) ?? 0;
  const carbs = numeric(product.nutriments?.carbohydrates_100g) ?? 0;
  const code = String(product.code || product._id || "").trim();
  const stableId = code || hashText(`${brand}|${name}`);
  const missingCoreData =
    kcal == null ||
    kcal < 0 ||
    kcal > 1200 ||
    protein < 0 ||
    fat < 0 ||
    carbs < 0;

  return {
    id: `off:${stableId}`,
    barcode: code || null,
    name,
    brand,
    category: "包装食品",
    basis: "g",
    kcal: kcal == null ? 0 : Math.round(kcal * 10) / 10,
    protein: Math.round(protein * 10) / 10,
    fat: Math.round(fat * 10) / 10,
    carbs: Math.round(carbs * 10) / 10,
    aliases: [brand, product.generic_name].filter(Boolean),
    servings: parseServing(product),
    source: "Open Food Facts",
    sourceKey: "remote",
    completeness: missingCoreData ? "incomplete" : "complete"
  };
}

async function searchOpenFoodFacts(query, signal) {
  const params = new URLSearchParams({
    search_terms: query,
    page_size: "20",
    fields:
      "code,product_name,product_name_zh,product_name_en,generic_name,brands,nutriments,serving_size"
  });
  const response = await fetch(`${OPEN_FOOD_FACTS_SEARCH}?${params.toString()}`, {
    method: "GET",
    mode: "cors",
    cache: "no-store",
    signal
  });

  if (!response.ok) {
    throw new Error(`Open Food Facts 暂时不可用（${response.status}）`);
  }

  const data = await response.json();
  const products = Array.isArray(data.products) ? data.products : [];
  const seen = new Set();

  return products
    .map(mapOpenFoodFactsProduct)
    .filter(Boolean)
    .filter((food) => {
      if (seen.has(food.id)) return false;
      seen.add(food.id);
      return true;
    });
}

function escapeSvgText(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function renderTrendChart({ dates, entriesByDate, weights, calorieGoal }) {
  const width = 680;
  const height = 238;
  const padding = { top: 18, right: 18, bottom: 33, left: 35 };
  const plotWidth = width - padding.left - padding.right;
  const plotHeight = height - padding.top - padding.bottom;
  const baseline = padding.top + plotHeight;
  const calories = dates.map((date) => entriesByDate.get(date)?.kcal || 0);
  const maximumCalories = Math.max(calorieGoal * 1.25, ...calories, 1);
  const weightMap = new Map(weights.map((record) => [record.date, Number(record.weight)]));
  const validWeights = dates
    .map((date, index) => ({ date, index, value: weightMap.get(date) }))
    .filter((item) => Number.isFinite(item.value) && item.value > 0);
  const hasData = calories.some(Boolean) || validWeights.length > 0;

  const xAt = (index) => {
    if (dates.length <= 1) return padding.left + plotWidth / 2;
    return padding.left + (index / (dates.length - 1)) * plotWidth;
  };
  const calorieYAt = (value) =>
    baseline - Math.min(plotHeight, Math.max(0, value / maximumCalories) * plotHeight);

  const weightValues = validWeights.map((item) => item.value);
  const weightMin = weightValues.length ? Math.min(...weightValues) : 0;
  const weightMax = weightValues.length ? Math.max(...weightValues) : 1;
  const weightSpread = Math.max(1, weightMax - weightMin);
  const weightYAt = (value) =>
    padding.top + ((weightMax + weightSpread * 0.12 - value) / (weightSpread * 1.24)) * plotHeight;

  const gridLines = Array.from({ length: 4 }, (_, index) => {
    const y = padding.top + (plotHeight / 3) * index;
    return `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="#e5e4da" stroke-width="1" />`;
  }).join("");

  const barWidth = Math.max(5, plotWidth / dates.length - 5);
  const bars = calories
    .map((value, index) => {
      if (!value) return "";
      const x = xAt(index) - barWidth / 2;
      const y = calorieYAt(value);
      const isOver = value > calorieGoal;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${(
        baseline - y
      ).toFixed(1)}" rx="${Math.min(4, barWidth / 2).toFixed(1)}" fill="${
        isOver ? "#c7604c" : "#e7a84b"
      }" opacity="${isOver ? 0.68 : 0.48}" />`;
    })
    .join("");

  const goalY = calorieYAt(calorieGoal);
  const goalLine = `<line x1="${padding.left}" y1="${goalY.toFixed(1)}" x2="${
    width - padding.right
  }" y2="${goalY.toFixed(1)}" stroke="#1f6f50" stroke-width="1.2" stroke-dasharray="5 6" opacity=".46" />`;

  const weightPoints = validWeights.map((item) => ({
    x: xAt(item.index),
    y: weightYAt(item.value),
    ...item
  }));
  const weightPath = weightPoints
    .map((point, index) => `${index === 0 ? "M" : "L"}${point.x.toFixed(1)} ${point.y.toFixed(1)}`)
    .join(" ");
  const weightDots = weightPoints
    .map(
      (point) =>
        `<circle cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(
          1
        )}" r="3.4" fill="#fffdf8" stroke="#1f6f50" stroke-width="2" />`
    )
    .join("");
  const weightLine = weightPath
    ? `<path d="${weightPath}" fill="none" stroke="#1f6f50" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />${weightDots}`
    : "";

  const labelIndexes = [...new Set([0, 7, 14, 21, dates.length - 1])].filter(
    (index) => index >= 0 && index < dates.length
  );
  const labels = labelIndexes
    .map((index) => {
      const date = parseDateKey(dates[index]);
      return `<text x="${xAt(index).toFixed(1)}" y="${height - 10}" text-anchor="middle" fill="#849087" font-size="9">${
        date.getMonth() + 1
      }.${date.getDate()}</text>`;
    })
    .join("");

  const weightLabel =
    validWeights.length && weightMax !== weightMin
      ? `<text x="${width - padding.right}" y="${(weightPoints.at(-1).y - 9).toFixed(
          1
        )}" text-anchor="end" fill="#1f6f50" font-size="10" font-weight="700">${escapeSvgText(
          weightPoints.at(-1).value.toFixed(1)
        )} kg</text>`
      : "";

  const emptyOverlay = !hasData
    ? `<text x="${width / 2}" y="${padding.top + plotHeight / 2}" text-anchor="middle" fill="#849087" font-size="12">记录食物和体重后，这里会出现趋势</text>`
    : "";

  return `
    <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="最近三十天热量与体重趋势图">
      <title>最近三十天热量与体重趋势</title>
      ${gridLines}
      ${goalLine}
      ${bars}
      ${weightLine}
      ${labels}
      ${weightLabel}
      ${emptyOverlay}
    </svg>
  `;
}

function escapeHtml(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    (character) =>
      ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]
  );
}

function labelForSource(entry) {
  if (entry.food?.sourceKey === "remote") return "联网";
  if (entry.food?.sourceKey === "custom") return "自定义";

  return calculateGoal(state.profile || DEFAULT_PROFILE);

function makeId(prefix) {
  if (crypto.randomUUID) return `${prefix}:${crypto.randomUUID()}`;
  return `${prefix}:${Date.now()}:${Math.random().toString(36).slice(2)}`;
}

function entriesForDate(date) {

function defaultMealForNow() {
  const hour = new Date().getHours();

function popularFoods() {
  const preferred = [
    "builtin:egg",

    "builtin:sweet-potato"
  ];

}

function normalizeSearchText(text) {
  return String(text || "")
    .toLowerCase()
    .replace(/\s+/g, "")
    .replace(/[，。,.!?！？()（）]/g, "");
}

function characterOverlapScore(needle, candidate) {
  const queryCharacters = [...new Set(normalizeSearchText(needle))];
  const candidateCharacters = new Set(normalizeSearchText(candidate));
  if (!queryCharacters.length) return 0;
  return queryCharacters.filter((character) => candidateCharacters.has(character)).length /
    queryCharacters.length;
}

function searchFoods(query, category = "全部") {
  const categoryFoods =
    category === "全部"
      ? state.foods
      : state.foods.filter((food) => food.category === category);
  if (!query) {
    return category === "全部"
      ? popularFoods()
      : categoryFoods
          .sort((a, b) => a.name.localeCompare(b.name, "zh-CN"))
          .slice(0, 40);
  }
  const needle = normalizeSearchText(query);
  const directResults = categoryFoods
    .map((food) => {
      const name = normalizeSearchText(food.name);
      const aliases = (food.aliases || []).map(normalizeSearchText);
      let score = 0;
      if (name === needle) score = 100;
      else if (aliases.includes(needle)) score = 95;
      else if (name.startsWith(needle)) score = 80;
      else if (aliases.some((alias) => alias.startsWith(needle))) score = 76;
      else if (name.includes(needle)) score = 60;
      else if (aliases.some((alias) => alias.includes(needle))) score = 55;
      else if (`${name}${aliases.join("")}`.includes(needle)) score = 40;
      return { food, score };
    })
    .filter((result) => result.score > 0)
    .sort((a, b) => b.score - a.score || a.food.name.localeCompare(b.food.name, "zh-CN"))
    .slice(0, 16)
    .map((result) => result.food);
  if (directResults.length) return directResults;

  return categoryFoods
    .map((food) => {
      const candidates = [food.name, ...(food.aliases || [])];
      const score = Math.max(...candidates.map((candidate) => characterOverlapScore(needle, candidate)));
      return { food, score };
    })
    .filter((result) => result.score >= 0.55)
    .sort((a, b) => b.score - a.score || a.food.name.localeCompare(b.food.name, "zh-CN"))
    .slice(0, 12)
    .map((result) => result.food);
}

  html += local
    .map(

function refreshSearchResults({ updateInput = false } = {}) {
  const results = document.querySelector("#search-results");

  if (!results) return;
  if (updateInput) {
    const input = document.querySelector("#food-search");
    if (input && input.value !== state.search.raw) input.value = state.search.raw;
  }
  results.innerHTML = renderSearchResults();
  if (count) {
    count.textContent = state.search.query
      ? `“${state.search.query}” · ${state.search.localResults.length + state.search.remoteResults.length} 个结果`
      : "常用食物";
  }
  if (hint) {
    hint.hidden = !state.search.quantity;
    hint.textContent =
      state.search.quantity && state.search.unit
        ? `已识别份量：${round1(state.search.quantity)} ${state.search.unit} · 搜索“${state.search.query}”`
        : "";
  }
  document.querySelectorAll(".category-chip").forEach((button) => {
    button.classList.toggle("is-active", button.dataset.category === state.search.category);
  });
}

function handleSearchInput(value) {
  const parsed = parseFoodQuery(value);
  state.search.raw = value;
  state.search.query = parsed.query;
  state.search.quantity = parsed.quantity;
  state.search.unit = parsed.unit;
  state.search.localResults = searchFoods(parsed.query, state.search.category);
  state.search.remoteResults = [];
  refreshSearchResults();

  if (state.search.debounceTimer) clearTimeout(state.search.debounceTimer);
  if (state.search.timeoutTimer) clearTimeout(state.search.timeoutTimer);
  if (state.search.controller) state.search.controller.abort();
  state.search.controller = null;

  if (state.search.category !== "全部" || normalizeSearchText(parsed.query).length < 2) {
    state.search.remoteStatus = "idle";
    refreshSearchResults();
    return;
  }

  if (!navigator.onLine) {
    state.search.remoteStatus = "error";
    state.search.remoteMessage = "当前处于离线状态，内置食物仍可正常使用。";
    refreshSearchResults();
    return;
  }

  state.search.remoteStatus = "loading";
  refreshSearchResults();
  state.search.debounceTimer = window.setTimeout(() => runRemoteSearch(parsed.query), 500);
}

async function runRemoteSearch(query) {
  const requestId = state.search.requestId + 1;
  state.search.requestId = requestId;
  const controller = new AbortController();
  state.search.controller = controller;
  let timedOut = false;
  state.search.timeoutTimer = window.setTimeout(() => {
    timedOut = true;
    controller.abort();
  }, 8000);

  try {
    const results = await searchOpenFoodFacts(query, controller.signal);
    if (requestId !== state.search.requestId || query !== state.search.query) return;
    const localNames = new Set(
      state.search.localResults.map((food) => `${normalizeSearchText(food.name)}|${normalizeSearchText(food.brand || "")}`)
    );
    state.search.remoteResults = results.filter(
      (food) => !localNames.has(`${normalizeSearchText(food.name)}|${normalizeSearchText(food.brand || "")}`)
    );
    state.search.remoteStatus = "success";
  } catch (error) {
    if (requestId !== state.search.requestId) return;
    if (error.name === "AbortError" && !timedOut) return;
    state.search.remoteStatus = "error";
    state.search.remoteMessage = timedOut
      ? "查询超过 8 秒，请检查网络后重试。"
      : "无法连接 Open Food Facts，请检查网络。";
  } finally {
    if (requestId === state.search.requestId) {
      clearTimeout(state.search.timeoutTimer);
      state.search.timeoutTimer = null;
      state.search.controller = null;
      refreshSearchResults();
    }
  }
}

function findFood(foodId) {
  return (
    state.search.localResults.find((food) => food.id === foodId) ||
    state.search.remoteResults.find((food) => food.id === foodId) ||

}

function openAmountSheet(food, entry = null) {
  closeSearchRequest();
  state.amountContext = { food, entry };
  let unitId = entry?.unitId || "base";
  let quantity = entry?.amount ?? 100;

  if (!entry && state.search.quantity) {
    const baseIntent = ["g", "克"].includes(state.search.unit)
      ? food.basis === "g"
      : ["ml", "毫升"].includes(state.search.unit)
        ? food.basis === "ml"
        : false;
    if (baseIntent) {
      unitId = "base";
      quantity = state.search.quantity;
    } else {
      const matchingServing = (food.servings || []).find((serving) =>
        normalizeSearchText(serving.label).includes(normalizeSearchText(state.search.unit))
      );
      if (matchingServing) {
        unitId = matchingServing.id;
        quantity = state.search.quantity;
      }
    }
  }

  openModal({
    title: entry ? "编辑记录" : "确认份量",
    subtitle: `${food.source} · 每 100 ${food.basis}`,
    body: renderAmountForm(food, entry, unitId, quantity),
    footer: `
      ${entry ? `<button class="button button-danger" type="button" data-action="delete-entry">${icons.trash} 删除</button>` : ""}

      <button class="button button-primary" type="submit" form="amount-form">${entry ? "保存修改" : "加入今天"}</button>
    `
  });

}

  const incomplete = food.completeness === "incomplete";
  return `
    <form id="amount-form" data-food-id="${escapeHtml(food.id)}" data-entry-id="${entry ? escapeHtml(entry.id) : ""}">
      <div class="selection-name">
        <span class="result-icon">${escapeHtml(food.name.slice(0, 1))}</span>
        <div>
          <strong>${escapeHtml(food.name)}</strong>
          <p>${food.brand ? `${escapeHtml(food.brand)} · ` : ""}${incomplete ? "包装营养数据不完整" : `每 100 ${food.basis} · ${roundWhole(food.kcal)} kcal`}</p>
        </div>
      </div>
      <div class="amount-grid">
        <div class="field">
          <label for="amount-quantity">数量</label>
          <input id="amount-quantity" name="quantity" type="number" inputmode="decimal" min="0.1" max="5000" step="0.1" value="${quantity}" required />
        </div>
        <div class="field">
          <label for="amount-unit">单位</label>
          <select id="amount-unit" name="unit">${unitOptions}</select>
        </div>
      </div>
      <div class="field" style="margin-top:12px">
        <label for="amount-meal">记录到</label>
        <select id="amount-meal" name="meal">
          ${Object.entries(MEALS)
            .map(
              ([meal, label]) =>
                `<option value="${meal}" ${(entry?.meal || state.search.meal) === meal ? "selected" : ""}>${label}</option>`
            )
            .join("")}
        </select>
      </div>
      ${
        incomplete
          ? `<p class="incomplete-note">该食品缺少可靠热量数据。请按包装标签补录每 100 g 的数值后再添加。</p>
            <div class="custom-nutrition-grid">
              ${renderNutritionInput("custom-kcal", "热量（kcal）", food.kcal || "")}
              ${renderNutritionInput("custom-protein", "蛋白质（g）", food.protein || "")}
              ${renderNutritionInput("custom-fat", "脂肪（g）", food.fat || "")}
              ${renderNutritionInput("custom-carbs", "碳水（g）", food.carbs || "")}
            </div>`
          : ""
      }
      <div class="nutrition-preview" id="nutrition-preview">${amountPreviewMarkup(food, entry, unitId, quantity)}</div>
      <p class="field-hint" id="amount-base-hint" style="margin-top:8px"></p>
    </form>
  `;
}

function renderNutritionInput(id, label, value) {
  return `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="number" min="0" step="0.1" value="${value}" required /></div>`;
}

function currentAmountValues(food) {
  const quantity = Math.max(0, Number(document.querySelector("#amount-quantity")?.value) || 0);
  const unitId = document.querySelector("#amount-unit")?.value || "base";
  const amountInBase = amountForServing(food, unitId, quantity);
  return { quantity, unitId, amountInBase };
}

function amountPreviewMarkup(food, entry, unitId, quantity) {
  const amountInBase = amountForServing(food, unitId, quantity);
  const nutrients = nutrientsForAmount(food, amountInBase);
  return `
    <div><strong data-preview="kcal">${roundWhole(nutrients.kcal)}</strong><span>kcal</span></div>
    <div><strong data-preview="protein">${round1(nutrients.protein)}</strong><span>蛋白质 g</span></div>
    <div><strong data-preview="fat">${round1(nutrients.fat)}</strong><span>脂肪 g</span></div>
    <div><strong data-preview="carbs">${round1(nutrients.carbs)}</strong><span>碳水 g</span></div>
  `;
}

function updateAmountPreview() {
  if (!state.amountContext) return;
  const { food } = state.amountContext;
  const { unitId, quantity, amountInBase } = currentAmountValues(food);
  let previewFood = food;
  if (food.completeness === "incomplete") {
    previewFood = {
      ...food,
      kcal: Number(document.querySelector("#custom-kcal")?.value) || 0,
      protein: Number(document.querySelector("#custom-protein")?.value) || 0,
      fat: Number(document.querySelector("#custom-fat")?.value) || 0,
      carbs: Number(document.querySelector("#custom-carbs")?.value) || 0
    };
  }
  const preview = document.querySelector("#nutrition-preview");
  if (preview) preview.innerHTML = amountPreviewMarkup(previewFood, null, unitId, quantity);
  const hint = document.querySelector("#amount-base-hint");
  if (hint) {
    const unit =
      unitId === "base"
        ? food.basis === "ml"
          ? "ml"
          : "g"
        : (food.servings || []).find((serving) => serving.id === unitId)?.label || food.basis;
    hint.textContent = `合计换算：${round1(amountInBase)} ${food.basis}（${unit}）`;
  }
}

async function handleAmountSubmit(form) {
  const context = state.amountContext;
  if (!context) return;
  const food = context.food;
  const entry = context.entry;
  const quantity = Number(form.elements.quantity.value);
  const unitId = form.elements.unit.value;
  const amountInBase = amountForServing(food, unitId, quantity);
  if (!Number.isFinite(quantity) || quantity <= 0 || amountInBase <= 0) {
    showToast("请输入大于 0 的数量。", "error");
    return;
  }
  if (amountInBase > 5000) {
    showToast("单次记录的份量过大，请检查克数或毫升数。", "error");
    return;
  }

  let foodToUse = { ...food };
  if (food.completeness === "incomplete") {
    foodToUse.kcal = clampNumber(form.elements["custom-kcal"]?.value, 0, 1200, 0);
    foodToUse.protein = clampNumber(form.elements["custom-protein"]?.value, 0, 100, 0);
    foodToUse.fat = clampNumber(form.elements["custom-fat"]?.value, 0, 100, 0);
    foodToUse.carbs = clampNumber(form.elements["custom-carbs"]?.value, 0, 100, 0);
    if (!foodToUse.kcal) {
      showToast("请补充每 100 g 的热量后再添加。", "error");
      return;
    }
    foodToUse.completeness = "complete";
  }

  const nutrients = nutrientsForAmount(foodToUse, amountInBase);
  const unitLabel =
    unitId === "base"
      ? null
      : (foodToUse.servings || []).find((serving) => serving.id === unitId)?.label || null;
  const snapshot = JSON.parse(JSON.stringify(foodToUse));
  const record = {
    id: entry?.id || makeId("entry"),
    date: entry?.date || state.selectedDate,
    meal: form.elements.meal.value,
    food: snapshot,
    amount: quantity,
    unitId,
    unitLabel,
    amountInBase,
    kcal: round1(nutrients.kcal),
    protein: round1(nutrients.protein),
    fat: round1(nutrients.fat),
    carbs: round1(nutrients.carbs),
    createdAt: entry?.createdAt || new Date().toISOString()
  };

  try {
    if (foodToUse.sourceKey === "remote" || foodToUse.sourceKey === "custom") {
      foodToUse.updatedAt = new Date().toISOString();
      await saveFood(foodToUse);
      const index = state.foods.findIndex((item) => item.id === foodToUse.id);
      if (index >= 0) state.foods[index] = foodToUse;
      else state.foods.push(foodToUse);
    }
    await saveEntry(record);
    const existingIndex = state.entries.findIndex((item) => item.id === record.id);
    if (existingIndex >= 0) state.entries[existingIndex] = record;
    else state.entries.push(record);
    closeModal();
    render();
    showToast(entry ? "记录已更新。" : `已加入${MEALS[record.meal]}。`);
  } catch (error) {
    console.error(error);
    showToast("保存失败，请重试。", "error");
  }
}

async function handleCustomFoodSubmit(form) {
  const name = form.elements.name.value.trim();
  const basis = form.elements.basis.value;
  const kcal = Number(form.elements["food-kcal"].value);
  const protein = Number(form.elements["food-protein"].value);
  const fat = Number(form.elements["food-fat"].value);
  const carbs = Number(form.elements["food-carbs"].value);
  const servingLabel = form.elements.servingLabel.value.trim();
  const servingAmount = Number(form.elements.servingAmount.value);
  if (!name) {
    showToast("请输入食物名称。", "error");
    return;
  }
  if (![kcal, protein, fat, carbs].every((value) => Number.isFinite(value) && value >= 0)) {
    showToast("营养数据必须是非负数字。", "error");
    return;
  }
  if (kcal > 1200 || protein > 100 || fat > 100 || carbs > 100) {
    showToast("营养数值看起来异常，请检查每 100 g 或 ml 的填写。", "error");
    return;
  }
  const servings = [];
  if (servingLabel && Number.isFinite(servingAmount) && servingAmount > 0) {
    servings.push({ id: "custom-serving", label: servingLabel, amount: servingAmount });
  }
  const food = {
    id: makeId("custom"),
    name,
    brand: "",
    category: "自定义",
    basis,
    kcal,
    protein,
    fat,
    carbs,
    aliases: [],
    servings,
    source: "自定义",
    sourceKey: "custom",
    completeness: "complete"
  };
  try {
    await saveFood(food);
    state.foods.push(food);
    showToast("自定义食物已保存。");
    openAmountSheet(food);
  } catch (error) {
    console.error(error);
    showToast("食物保存失败，请重试。", "error");
  }
}

function exportBackup() {
  const payload = {
    format: BACKUP_FORMAT,
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    profile: state.profile,
    entries: state.entries,
    weights: state.weights,

  link.click();

function isValidDateKey(value) {
  return typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value);
}

function sanitizeBackup(payload) {
  if (!payload || payload.format !== BACKUP_FORMAT || Number(payload.version) !== BACKUP_VERSION) {
    throw new Error("这不是受支持的食刻备份文件。");
  }
  if (!Array.isArray(payload.entries) || !Array.isArray(payload.weights)) {
    throw new Error("备份文件缺少饮食或体重记录。");
  }
  if (payload.entries.length > 50000 || payload.weights.length > 10000) {
    throw new Error("备份文件过大，无法安全导入。");
  }

  const entries = payload.entries
    .filter(
      (entry) =>
        entry &&
        typeof entry.id === "string" &&
        isValidDateKey(entry.date) &&
        MEALS[entry.meal] &&
        entry.food &&
        typeof entry.food.name === "string"
    )
    .map((entry) => ({
      id: entry.id,
      date: entry.date,
      meal: entry.meal,
      food: {
        id: String(entry.food.id || makeId("restored-food")),
        name: String(entry.food.name).slice(0, 100),
        brand: String(entry.food.brand || "").slice(0, 100),
        category: String(entry.food.category || "已恢复食物"),
        basis: entry.food.basis === "ml" ? "ml" : "g",
        kcal: clampNumber(entry.food.kcal, 0, 1200, 0),
        protein: clampNumber(entry.food.protein, 0, 100, 0),
        fat: clampNumber(entry.food.fat, 0, 100, 0),
        carbs: clampNumber(entry.food.carbs, 0, 100, 0),
        aliases: Array.isArray(entry.food.aliases)
          ? entry.food.aliases.filter((item) => typeof item === "string").slice(0, 20)
          : [],
        servings: Array.isArray(entry.food.servings)
          ? entry.food.servings.slice(0, 20).map((serving, index) => ({
              id: String(serving.id || `restored-serving-${index}`),
              label: String(serving.label || "1 份").slice(0, 40),
              amount: clampNumber(serving.amount, 0.1, 5000, 100)
            }))
          : [],
        source: String(entry.food.source || "备份恢复"),
        sourceKey: ["custom", "remote"].includes(entry.food.sourceKey)
          ? entry.food.sourceKey
          : "custom",
        completeness: "complete"
      },
      amount: clampNumber(entry.amount, 0.1, 5000, 100),
      unitId: String(entry.unitId || "base"),
      unitLabel: entry.unitLabel ? String(entry.unitLabel).slice(0, 50) : null,
      amountInBase: clampNumber(entry.amountInBase, 0.1, 5000, 100),
      kcal: clampNumber(entry.kcal, 0, 60000, 0),
      protein: clampNumber(entry.protein, 0, 5000, 0),
      fat: clampNumber(entry.fat, 0, 5000, 0),
      carbs: clampNumber(entry.carbs, 0, 5000, 0),
      createdAt:
        typeof entry.createdAt === "string" ? entry.createdAt : new Date().toISOString()
    }));

  const weights = payload.weights
    .filter(
      (record) =>
        record && isValidDateKey(record.date) && Number.isFinite(Number(record.weight))
    )
    .map((record) => ({
      date: record.date,
      weight: clampNumber(record.weight, 30, 300, 70),
      updatedAt: typeof record.updatedAt === "string" ? record.updatedAt : new Date().toISOString()
    }));

  const foods = (Array.isArray(payload.foods) ? payload.foods : [])
    .filter(
      (food) =>
        food &&
        typeof food.id === "string" &&
        typeof food.name === "string" &&
        food.sourceKey !== "builtin"
    )
    .slice(0, 5000)
    .map((food) => ({
      id: food.id,
      name: food.name.slice(0, 100),
      brand: String(food.brand || "").slice(0, 100),
      category: String(food.category || "自定义").slice(0, 50),
      basis: food.basis === "ml" ? "ml" : "g",
      kcal: clampNumber(food.kcal, 0, 1200, 0),
      protein: clampNumber(food.protein, 0, 100, 0),
      fat: clampNumber(food.fat, 0, 100, 0),
      carbs: clampNumber(food.carbs, 0, 100, 0),
      aliases: Array.isArray(food.aliases)
        ? food.aliases.filter((item) => typeof item === "string").slice(0, 20)
        : [],
      servings: Array.isArray(food.servings)
        ? food.servings.slice(0, 20).map((serving, index) => ({
            id: String(serving.id || `restored-serving-${index}`),
            label: String(serving.label || "1 份").slice(0, 40),
            amount: clampNumber(serving.amount, 0.1, 5000, 100)
          }))
        : [],
      source: String(food.source || "备份恢复"),
      sourceKey: food.sourceKey === "remote" ? "remote" : "custom",
      completeness: "complete"
    }));

  let profile = null;
  if (payload.profile && typeof payload.profile === "object") {
    profile = {
      id: "default",
      sex: payload.profile.sex === "female" ? "female" : "male",
      age: clampNumber(payload.profile.age, 18, 100, 25),
      height: clampNumber(payload.profile.height, 120, 230, 170),
      currentWeight: clampNumber(payload.profile.currentWeight, 30, 300, 70),
      targetWeight: clampNumber(payload.profile.targetWeight, 30, 300, 65),
      activity: ACTIVITY_LEVELS[payload.profile.activity]
        ? payload.profile.activity
        : "sedentary",
      weeklyLoss: clampNumber(payload.profile.weeklyLoss, 0, 1, 0.5),
      goalOverride:
        payload.profile.goalOverride == null
          ? null
          : clampNumber(payload.profile.goalOverride, 800, 6000, 1600)
    };
  }
  return { profile, entries, weights, foods };
}

async function handleBackupFile(file, input) {
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) {
    showToast("备份文件超过 10 MB，无法导入。", "error");
    input.value = "";
    return;
  }
  try {
    const payload = JSON.parse(await file.text());
    const restored = sanitizeBackup(payload);
    const confirmed = window.confirm(
      `即将用备份恢复 ${restored.entries.length} 条饮食记录和 ${restored.weights.length} 条体重记录。\n\n当前记录会被替换，是否继续？`
    );
    if (!confirmed) {
      input.value = "";
      return;
    }
    await replaceUserData(restored);
    state.profile = restored.profile;
    state.foods = await getAllFoods();
    state.entries = restored.entries;
    state.weights = restored.weights;
    state.selectedDate = toDateKey();
    input.value = "";
    render();
    showToast("备份已恢复。");
    if (!state.profile) openOnboarding();
  } catch (error) {
    console.error(error);
    input.value = "";
    showToast(error.message || "备份文件无法读取。", "error");
  }
}

function navigate(view, date = null) {
  if (!["today", "history", "profile"].includes(view)) view = "today";
  state.view = view;
  if (date) state.selectedDate = date;
  if (location.hash !== `#${view}`) history.replaceState(null, "", `#${view}`);
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function handleDocumentClick(event) {
  const actionElement = event.target.closest("[data-action]");
  const navButton = event.target.closest(".nav-item");
  if (navButton) {
    navigate(navButton.dataset.view);
    return;
  }
  if (!actionElement) {
    if (event.target.classList.contains("modal-backdrop")) closeModal();
    return;
  }

  const { action } = actionElement.dataset;
  if (action === "close-modal") closeModal();
  else if (action === "add-food")
    openFoodSearch(actionElement.dataset.meal || defaultMealForNow());
  else if (action === "previous-day") {
    state.selectedDate = shiftDateKey(state.selectedDate, -1);
    render();
  } else if (action === "next-day") {
    if (state.selectedDate >= toDateKey()) return;
    state.selectedDate = shiftDateKey(state.selectedDate, 1);
    render();
  } else if (action === "edit-entry") editEntry(actionElement.dataset.entryId);
  else if (action === "choose-food") {
    const food = findFood(actionElement.dataset.foodId);
    if (food) openAmountSheet(food);
  } else if (action === "retry-remote") {
    if (state.search.query) runRemoteSearch(state.search.query);
  } else if (action === "filter-food-category") {
    closeSearchRequest();
    state.search.category = actionElement.dataset.category || "全部";
    state.search.localResults = searchFoods(state.search.query, state.search.category);
    state.search.remoteResults = [];
    state.search.remoteStatus = "idle";
    refreshSearchResults();
  } else if (action === "open-custom-food") openCustomFoodForm();
  else if (action === "delete-entry") deleteCurrentEntry();
  else if (action === "open-day") navigate("today", actionElement.dataset.date);
  else if (action === "open-install") openInstallInstructions();
  else if (action === "prompt-install") promptInstall();
  else if (action === "export-backup") exportBackup();
  else if (action === "import-backup") openBackupPicker();
  else if (action === "clear-data") clearData();
}

function handleDocumentInput(event) {
  const target = event.target;
  if (target.id === "food-search") {
    handleSearchInput(target.value);
  } else if (
    ["amount-quantity", "amount-unit", "custom-kcal", "custom-protein", "custom-fat", "custom-carbs"].includes(
      target.id
    )
  ) {
    updateAmountPreview();
  } else if (target.closest("[data-profile-form]")) {
    updateGoalPreview(target.form);
  } else if (target.id === "backup-file-input" && target.files?.[0]) {
    void handleBackupFile(target.files[0], target);
  }
}

function handleDocumentChange(event) {
  const target = event.target;
  if (target.id === "selected-date") {
    state.selectedDate = target.value || toDateKey();
    render();
  } else if (
    ["amount-unit", "amount-meal", "custom-kcal", "custom-protein", "custom-fat", "custom-carbs"].includes(
      target.id
    )
  ) {
    updateAmountPreview();
  } else if (target.id === "weight-date") {
    const record = state.weights.find((item) => item.date === target.value);
    const weightInput = document.querySelector("#weight-value");
    if (weightInput) weightInput.value = record ? record.weight : "";
  } else if (target.closest("[data-profile-form]")) {
    updateGoalPreview(target.form);
  }
}

async function handleDocumentSubmit(event) {
  const form = event.target;
  if (form.id === "amount-form") {
    event.preventDefault();
    await handleAmountSubmit(form);
  } else if (form.id === "custom-food-form") {
    event.preventDefault();
    await handleCustomFoodSubmit(form);
  } else if (form.id === "weight-form") {
    event.preventDefault();
    await handleWeightSubmit(form);
  } else if (form.matches("[data-profile-form]")) {
    event.preventDefault();
    await handleProfileSubmit(form, form.dataset.profileForm === "onboarding");
  }
}

function handleKeydown(event) {
  if (event.key === "Escape" && state.modalOpen) closeModal();
}

function bindGlobalEvents() {
  document.addEventListener("click", handleDocumentClick);
  document.addEventListener("input", handleDocumentInput);
  document.addEventListener("change", handleDocumentChange);
  document.addEventListener("submit", handleDocumentSubmit);
  document.addEventListener("keydown", handleKeydown);
  document.querySelector("#quick-profile-button").addEventListener("click", () => navigate("profile"));
  floatingAdd.addEventListener("click", () => openFoodSearch(defaultMealForNow()));
  window.addEventListener("online", updateConnectionBadge);
  window.addEventListener("offline", updateConnectionBadge);
  window.addEventListener("hashchange", () => {
    const nextView = location.hash.replace("#", "");
    if (["today", "history", "profile"].includes(nextView)) {
      state.view = nextView;
      render();
    }
  });
  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    state.installPrompt = event;
  });
}

async function registerServiceWorker() {
  if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
  try {
    await navigator.serviceWorker.register("./sw.js", { scope: "./" });
  } catch (error) {
    console.warn("Service Worker 注册失败", error);
  }
}

async function start() {
  try {
    await initDatabase();
    const [profile, foods, entries, weights] = await Promise.all([
      getProfile(),
      getAllFoods(),
      getAllEntries(),
      getAllWeights()
    ]);
    state.profile = profile;
    state.foods = foods;
    state.entries = entries;
    state.weights = weights;
    const hashView = location.hash.replace("#", "");
    if (["today", "history", "profile"].includes(hashView)) state.view = hashView;
    bindGlobalEvents();
    render();
    updateConnectionBadge();
    registerServiceWorker();
    if (!profile) window.setTimeout(openOnboarding, 280);
  } catch (error) {
    console.error(error);
    main.innerHTML = `
      <div class="empty-state" style="margin-top:40px">
        <div class="empty-state-icon">!</div>
        <h2>无法打开本地数据</h2>
        <p>请确认浏览器允许网站使用本地存储，并关闭隐私模式后重新打开。</p>
      </div>
    `;
  }
}

start();

})();
</script>
  </body>
</html>
